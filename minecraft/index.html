<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Control</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<main class="container">

    <!-- MAIN CONNECTOR -->
    <section class="server-card glass">

        <div class="server-top">

            <div>
                <div class="label">MAIN CONNECTOR</div>
                <h1>Main Connector</h1>
                <p class="subtext">Controls the main server machine</p>
            </div>

            <div id="connectorBadge" class="status-badge offline">
                <span class="status-dot"></span>
                <span id="connectorStatus">OFFLINE</span>
            </div>

        </div>

        <div id="connectorStatusCard" class="status-card offline">

            <div id="connectorSymbol" class="status-symbol">
                ●
            </div>

            <div>
                <div class="label">STATUS</div>
                <h2 id="connectorTitle">Offline</h2>
                <p id="connectorDescription">
                    The main connector is currently offline.
                </p>
            </div>

        </div>

        <div class="controls">

            <button id="connectorOn" class="control-btn on" type="button">
                <span>▶</span>
                ON
            </button>

            <button id="connectorOff" class="control-btn off" type="button">
                <span>■</span>
                OFF
            </button>

            <button id="connectorRestart" class="control-btn restart" type="button">
                <span>↻</span>
                RESTART
            </button>

        </div>

    </section>


    <!-- SERVERS DROPDOWN -->
    <section class="servers-section">

        <div class="label">SERVERS</div>

        <div id="dropdown" class="dropdown">

            <button
                id="dropdownButton"
                class="dropdown-button"
                type="button"
            >
                <span id="dropdownText">Choose a server</span>
                <span id="dropdownArrow">⌄</span>
            </button>

            <div id="dropdownMenu" class="dropdown-menu">

                <button class="server-option" data-server="PVP" type="button">
                    PVP
                </button>

                <button class="server-option" data-server="SMP" type="button">
                    SMP
                </button>

                <button class="server-option" data-server="SKYWARS" type="button">
                    SKYWARS
                </button>

                <button class="server-option" data-server="MINIGAME" type="button">
                    MINIGAME
                </button>

                <button class="server-option" data-server="ETC" type="button">
                    ETC
                </button>

                <button class="server-option" data-server="PILLARS OF FORTUNE" type="button">
                    PILLARS OF FORTUNE
                </button>

            </div>

        </div>

    </section>


    <!-- SELECTED SERVER -->
    <section
        id="selectedServerCard"
        class="server-card glass hidden"
    >

        <div class="server-top">

            <div>
                <div class="label">SERVER</div>
                <h1 id="selectedServerName">PVP</h1>
            </div>

            <div id="serverBadge" class="status-badge offline">

                <span class="status-dot"></span>

                <span id="serverStatus">
                    OFFLINE
                </span>

            </div>

        </div>


        <div id="serverStatusCard" class="status-card offline">

            <div id="serverSymbol" class="status-symbol">
                ●
            </div>

            <div>

                <div class="label">STATUS</div>

                <h2 id="serverTitle">
                    Offline
                </h2>

                <p id="serverDescription">
                    This server is currently stopped.
                </p>

            </div>

        </div>


        <div class="controls">

            <button id="serverOn" class="control-btn on" type="button">
                <span>▶</span>
                ON
            </button>

            <button id="serverOff" class="control-btn off" type="button">
                <span>■</span>
                OFF
            </button>

            <button id="serverRestart" class="control-btn restart" type="button">
                <span>↻</span>
                RESTART
            </button>

        </div>

    </section>


    <!-- SELF HOST -->
    <section class="self-host-section">

        <button
            id="selfHostButton"
            class="self-host-button"
            type="button"
        >
            SELF HOST
        </button>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
