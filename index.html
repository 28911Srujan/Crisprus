<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Presentation</title>
    <!-- Include Three.js for 3D Earth rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #030712;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* 3D Canvas Background */
        #webgl-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Glassmorphism Download Card */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(46, 164, 79, 0.15);
        }

        h1 {
            font-size: 1.6rem;
            color: #f0f6fc;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            color: #8b949e;
            margin-bottom: 30px;
            word-break: break-word;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #238636, #2ea44f);
            border: none;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.4);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #2ea44f, #3fb950);
            box-shadow: 0 6px 25px rgba(46, 164, 79, 0.6);
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Canvas for 3D Earth -->
    <canvas id="webgl-bg"></canvas>

    <div class="card">
        <h1>Green Skill Presentation</h1>
        <p>X A - 9 - Green Skill.pptx</p>
        <a href="X A - 9 - Green Skill.pptx" download class="download-btn">Download PowerPoint</a>
    </div>

    <script>
        // Setup Three.js Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-bg'), antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Create 3D Globe with Texture Map
        const geometry = new THREE.SphereGeometry(2.2, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/land_ocean_ice_cloud_2048.jpg');
        
        const material = new THREE.MeshPhongMaterial({
            map: earthTexture,
            shininess: 15
        });

        const earth = new THREE.Mesh(geometry, material);
        scene.add(earth);

        // Add Outer Atmosphere Glow
        const atmosGeometry = new THREE.SphereGeometry(2.28, 64, 64);
        const atmosMaterial = new THREE.MeshBasicMaterial({
            color: 0x1f6feb,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosGeometry, atmosMaterial);
        scene.add(atmosphere);

        // Add Starfield Background Particles
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 1200;
        const starPositions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 100;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333333, 1.2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        camera.position.z = 5;

        // Continuous Rotation Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            earth.rotation.y += 0.002;
            atmosphere.rotation.y += 0.002;
            starField.rotation.y -= 0.0003;

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
