<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Presentation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #090d16;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated Glowing Background Orbs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: float 10s infinite alternate ease-in-out;
            z-index: 1;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: #238636;
            top: -50px;
            left: -50px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #1f6feb;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, 80px) scale(1.15);
            }
        }

        /* Glassmorphism Card Container */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 1.6rem;
            color: #f0f6fc;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            color: #8b949e;
            margin-bottom: 30px;
            word-break: break-word;
        }

        /* Animated Download Button */
        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #238636, #2ea44f);
            border: none;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.3);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #2ea44f, #3fb950);
            box-shadow: 0 6px 20px rgba(46, 164, 79, 0.5);
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="card">
        <h1>Green Skill Presentation</h1>
        <p>X A - 9 - Green Skill.pptx</p>
        <a href="X A - 9 - Green Skill.pptx" download class="download-btn">Download PowerPoint</a>
    </div>

</body>
</html>
