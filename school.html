<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crisprus B2 Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">

  <!-- Login Gate Screen -->
  <div id="loginSection" class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl space-y-4">
    <div class="text-center space-y-1">
      <h1 class="text-xl font-bold text-white">Crisprus B2 Vault</h1>
      <p class="text-xs text-slate-400">Enter password to access Backblaze storage</p>
    </div>
    <div class="space-y-3">
      <input type="password" id="vaultPassword" placeholder="Enter password..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
      <button onclick="checkPassword()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg text-sm transition shadow-lg">
        Unlock Vault
      </button>
      <p id="loginError" class="text-xs text-center text-red-400 hidden">Incorrect password!</p>
    </div>
  </div>

  <!-- Main Application UI (Hidden by default until login) -->
  <div id="appSection" class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl space-y-6 hidden">
    
    <!-- Title & Target Bucket -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">Crisprus B2 Vault</h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-emerald-400 bg-emerald-950 px-2.5 py-1 rounded border border-emerald-800 font-medium">B2 Connected</span>
        <button onclick="lockVault()" class="text-xs text-slate-400 hover:text-red-400 transition">Lock</button>
      </div>
    </div>

    <!-- Upload Box -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-300">Upload File</label>
      <div class="border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-900/50 rounded-xl p-6 text-center cursor-pointer transition relative">
        <input type="file" id="fileInput" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="updateFileLabel()">
        <p id="fileLabel" class="text-sm text-slate-400">Click or drag file here to select</p>
      </div>
      
      <!-- Upload Progress Bar (Hidden by default) -->
      <div id="uploadProgressWrapper" class="hidden space-y-1 mt-2">
        <div class="flex justify-between text-[11px] text-slate-400 font-medium">
          <span id="progressPercent">0%</span>
          <span id="progressEta">Calculating...</span>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <button onclick="uploadFile()" id="uploadBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg flex items-center justify-center gap-2 mt-2">
        Upload Confirm
      </button>
    </div>

    <!-- File Manager Box -->
    <div class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-semibold text-slate-300">Files in Bucket</h2>
        <button onclick="fetchFiles()" class="text-xs text-indigo-400 hover:underline">Refresh List</button>
      </div>
      <div id="fileList" class="bg-slate-900 border border-slate-700 rounded-lg divide-y divide-slate-800 max-h-64 overflow-y-auto">
        <p class="text-center py-4 text-xs text-slate-500">Loading files...</p>
      </div>
    </div>

  </div>

  <!-- Status Message -->
  <div id="statusMsg" class="hidden text-xs text-center p-2 rounded-lg mt-4 max-w-xl w-full"></div>

  <!-- Preview Modal -->
  <div id="previewModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-slate-700 p-4">
        <h3 id="modalTitle" class="text-sm font-semibold text-slate-200 truncate pr-4">File Preview</h3>
        <div class="flex items-center gap-3">
          <a id="modalDownloadBtn" href="#" download target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs font-medium transition">Download</a>
          <button onclick="closePreview()" class="text-slate-400 hover:text-white text-lg">✕</button>
        </div>
      </div>
      <!-- Modal Body -->
      <div id="modalBody" class="p-4 overflow-y-auto flex-1 bg-slate-900 text-slate-200 font-sans text-sm">
        <p class="text-slate-500 text-center py-8">Loading content...</p>
      </div>
    </div>
  </div>

  <!-- Scripts using Modular AWS SDK v3 for Backblaze B2 S3 API -->
  <script type="module">
    import { 
      S3Client, 
      PutObjectCommand, 
      ListObjectsV2Command, 
      GetObjectCommand, 
      DeleteObjectCommand 
    } from "https://cdn.jsdelivr.net/npm/@aws-sdk/client-s3/+esm";
    import { getSignedUrl } from "https://cdn.jsdelivr.net/npm/@aws-sdk/s3-request-presigner/+esm";

    // Backblaze B2 Configuration
    const BUCKET_NAME = "minecraft-world-storage";
    const KEY_ID = "0032c7c53b36c7b0000000001";
    const APPLICATION_KEY = "K003s9y/sI3fwfE6fD9Fclp/phRE9qI";
    const ENDPOINT_URL = "https://s3.eu-central-003.backblazeb2.com";
    const REGION = "eu-central-003";
    const FOLDER_PREFIX = "vault/";

    // Initialize S3 Client for Backblaze B2
    const s3Client = new S3Client({
      region: REGION,
      endpoint: ENDPOINT_URL,
      credentials: {
        accessKeyId: KEY_ID,
        secretAccessKey: APPLICATION_KEY
      },
      forcePathStyle: true
    });

    // Hardcoded password for the vault
    const vaultPassword = '1234';

    // Expose functions to global scope for HTML inline event handlers
    window.checkPassword = function() {
      const inputVal = document.getElementById('vaultPassword').value;
      const errorEl = document.getElementById('loginError');

      if (inputVal === vaultPassword) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        errorEl.classList.add('hidden');
        document.getElementById('vaultPassword').value = '';
        window.fetchFiles();
      } else {
        errorEl.classList.remove('hidden');
      }
    };

    window.lockVault = function() {
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    };

    window.updateFileLabel = function() {
      const input = document.getElementById('fileInput');
      if (input.files.length > 0) {
        document.getElementById('fileLabel').innerText = `Selected: ${input.files[0].name}`;
      }
    };

    window.uploadFile = async function() {
      const input = document.getElementById('fileInput');
      if (!input.files.length) return showStatus('Please select a file first!', 'red');

      const file = input.files[0];
      const btn = document.getElementById('uploadBtn');
      const progressWrapper = document.getElementById('uploadProgressWrapper');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const progressEta = document.getElementById('progressEta');

      // UI Setup for Uploading
      btn.innerText = "Preparing Upload...";
      btn.disabled = true;
      progressWrapper.classList.remove('hidden');
      progressBar.style.width = '0%';
      progressPercent.innerText = '0%';
      progressEta.innerText = 'Calculating...';

      try {
        // 1. Generate a Presigned URL for PUT request
        const command = new PutObjectCommand({
          Bucket: BUCKET_NAME,
          Key: FOLDER_PREFIX + file.name,
          ContentType: file.type || 'application/octet-stream'
        });
        
        const uploadUrl = await getSignedUrl(s3Client, command, { expiresIn: 3600 });

        // 2. Use XMLHttpRequest to track upload progress
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', uploadUrl, true);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

        const startTime = Date.now();

        xhr.upload.onprogress = function(event) {
          if (event.lengthComputable) {
            const percent = Math.round((event.loaded / event.total) * 100);
            progressBar.style.width = percent + '%';
            progressPercent.innerText = percent + '%';
            btn.innerText = `Uploading... ${percent}%`;

            // Calculate ETA
            const timeElapsed = (Date.now() - startTime) / 1000; // in seconds
            if (timeElapsed > 0 && event.loaded > 0) {
              const speed = event.loaded / timeElapsed; // bytes per second
              const remainingBytes = event.total - event.loaded;
              const secondsRemaining = Math.round(remainingBytes / speed);

              if (secondsRemaining > 60) {
                const mins = Math.floor(secondsRemaining / 60);
                const secs = secondsRemaining % 60;
                progressEta.innerText = `ETA: ${mins}m ${secs}s left`;
              } else {
                progressEta.innerText = `ETA: ${secondsRemaining}s left`;
              }
            }
          }
        };

        xhr.onload = function() {
          if (xhr.status >= 200 && xhr.status < 300) {
            showStatus(`Success! Saved ${file.name} to B2 bucket.`, 'green');
            document.getElementById('fileInput').value = '';
            document.getElementById('fileLabel').innerText = 'Click or drag file here to select';
            window.fetchFiles();
          } else {
            showStatus(`Upload failed: Server responded with status ${xhr.status}`, 'red');
          }
          resetUploadUI();
        };

        xhr.onerror = function() {
          showStatus('Upload failed due to a network error.', 'red');
          resetUploadUI();
        };

        xhr.send(file);

      } catch (e) {
        showStatus(`Upload error: ${e.message}`, 'red');
        resetUploadUI();
      }

      function resetUploadUI() {
        btn.innerText = "Upload Confirm";
        btn.disabled = false;
        // Hide the progress bar after 2 seconds so the user can see it hit 100%
        setTimeout(() => {
            progressWrapper.classList.add('hidden');
            progressBar.style.width = '0%';
        }, 2000);
      }
    };

    window.fetchFiles = async function() {
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '<p class="text-center py-4 text-xs text-slate-500">Loading files from B2...</p>';

      try {
        const command = new ListObjectsV2Command({
          Bucket: BUCKET_NAME,
          Prefix: FOLDER_PREFIX
        });

        const response = await s3Client.send(command);
        const contents = response.Contents || [];
        
        // Filter out the folder placeholder itself if present
        const files = contents.filter(item => item.Key !== FOLDER_PREFIX);

        listEl.innerHTML = '';

        if (files.length === 0) {
          listEl.innerHTML = `<p class="text-center py-4 text-xs text-slate-500">Vault folder is empty</p>`;
          return;
        }

        for (const fileObj of files) {
          const fileName = fileObj.Key.replace(FOLDER_PREFIX, '');
          if (!fileName) continue;

          // Generate a presigned URL valid for 1 hour for secure viewing/downloading
          const getCommand = new GetObjectCommand({
            Bucket: BUCKET_NAME,
            Key: fileObj.Key
          });
          const signedUrl = await getSignedUrl(s3Client, getCommand, { expiresIn: 3600 });

          const item = document.createElement('div');
          item.className = 'flex items-center justify-between p-3 text-xs';
          item.innerHTML = `
            <span class="truncate max-w-[160px] font-medium text-slate-200" title="${fileName}">${fileName}</span>
            <div class="flex items-center gap-2">
              <button onclick="previewFile('${fileName}', '${signedUrl}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded text-[11px] font-medium transition">Preview</button>
              <a href="${signedUrl}" download target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded text-[11px] font-medium transition">Download</a>
              <button onclick="deleteFile('${fileObj.Key}', '${fileName}')" class="text-slate-500 hover:text-red-400 p-1">✕</button>
            </div>
          `;
          listEl.appendChild(item);
        }
      } catch (e) {
        console.error(e);
        listEl.innerHTML = `<p class="text-center py-4 text-xs text-red-400">Error loading files from B2</p>`;
      }
    };

    window.previewFile = async function(filename, downloadUrl) {
      const modal = document.getElementById('previewModal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');
      const dlBtn = document.getElementById('modalDownloadBtn');

      title.innerText = filename;
      dlBtn.href = downloadUrl;
      body.innerHTML = '<p class="text-slate-500 text-center py-8">Loading content...</p>';
      modal.classList.remove('hidden');

      const ext = filename.split('.').pop().toLowerCase();
      const imageExts = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'];

      if (imageExts.includes(ext)) {
        body.innerHTML = `<div class="flex justify-center"><img src="${downloadUrl}" class="max-h-[60vh] object-contain rounded-lg shadow" alt="${filename}"></div>`;
      } else {
        try {
          const res = await fetch(downloadUrl);
          const text = await res.text();

          if (ext === 'md') {
            body.innerHTML = `<div class="prose prose-invert max-w-none text-xs leading-relaxed">${marked.parse(text)}</div>`;
          } else {
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.innerText = text;
            pre.appendChild(code);
            pre.className = 'text-xs p-3 bg-slate-950 rounded border border-slate-800 overflow-x-auto';
            body.innerHTML = '';
            body.appendChild(pre);
            hljs.highlightElement(code);
          }
        } catch (e) {
          body.innerHTML = `<p class="text-red-400 text-center py-8">Failed to preview file contents.</p>`;
        }
      }
    };

    window.closePreview = function() {
      document.getElementById('previewModal').classList.add('hidden');
    };

    window.deleteFile = async function(fullKey, filename) {
      if (!confirm(`Delete ${filename} from Backblaze B2?`)) return;
      
      try {
        const command = new DeleteObjectCommand({
          Bucket: BUCKET_NAME,
          Key: fullKey
        });

        await s3Client.send(command);
        showStatus('File deleted successfully', 'green');
        window.fetchFiles();
      } catch (e) {
        showStatus('Failed to delete file: ' + e.message, 'red');
      }
    };

    function showStatus(text, type) {
      const el = document.getElementById('statusMsg');
      el.innerText = text;
      el.className = `text-xs text-center p-2 rounded-lg ${type === 'green' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    // Allow pressing 'Enter' to submit password
    document.getElementById('vaultPassword').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') window.checkPassword();
    });
  </script>
</body>
</html>
