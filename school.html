<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crisprus Storage Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">

  <div class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl space-y-6">
    
    <!-- Title & Target Repo -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">Crisprus Vault</h1>
        <p class="text-xs text-indigo-400 mt-0.5">Target Repo: <span class="font-mono text-slate-300">28911srujan/Crisprus</span></p>
      </div>
      <button onclick="clearToken()" class="text-xs text-slate-400 hover:text-red-400 underline">Reset Token</button>
    </div>

    <!-- Token Input Box (Only visible if token is missing) -->
    <div id="tokenSection" class="space-y-3 bg-slate-900/60 p-4 border border-slate-700 rounded-lg">
      <label class="block text-xs font-semibold text-slate-300">GitHub Personal Access Token (PAT)</label>
      <div class="flex gap-2">
        <input type="password" id="patToken" placeholder="ghp_xxxxxxxxxxxx" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white font-mono">
        <button onclick="saveToken()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition">Save Key</button>
      </div>
      <p class="text-[11px] text-slate-400">Needs <code>repo</code> scope permission to enable file uploads and management.</p>
    </div>

    <!-- Main Application UI -->
    <div id="appSection" class="space-y-6 hidden">
      
      <!-- Upload Box -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-300">Upload File</label>
        <div class="border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-900/50 rounded-xl p-6 text-center cursor-pointer transition relative">
          <input type="file" id="fileInput" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="updateFileLabel()">
          <p id="fileLabel" class="text-sm text-slate-400">Click or drag file here to select</p>
        </div>
        <button onclick="uploadFile()" id="uploadBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg flex items-center justify-center gap-2">
          Upload Confirm
        </button>
      </div>

      <!-- File Manager Box -->
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-semibold text-slate-300">Files in Repository</h2>
          <button onclick="fetchFiles()" class="text-xs text-indigo-400 hover:underline">Refresh List</button>
        </div>
        <div id="fileList" class="bg-slate-900 border border-slate-700 rounded-lg divide-y divide-slate-800 max-h-64 overflow-y-auto">
          <p class="text-center py-4 text-xs text-slate-500">Loading files...</p>
        </div>
      </div>

    </div>

    <!-- Status Message -->
    <div id="statusMsg" class="hidden text-xs text-center p-2 rounded-lg"></div>

  </div>

  <!-- Preview Modal -->
  <div id="previewModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-slate-700 p-4">
        <h3 id="modalTitle" class="text-sm font-semibold text-slate-200 truncate pr-4">File Preview</h3>
        <div class="flex items-center gap-3">
          <a id="modalDownloadBtn" href="#" download target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs font-medium transition">Download</a>
          <button onclick="closePreview()" class="text-slate-400 hover:text-white text-lg">✕</button>
        </div>
      </div>
      <!-- Modal Body -->
      <div id="modalBody" class="p-4 overflow-y-auto flex-1 bg-slate-900 text-slate-200 font-sans text-sm">
        <p class="text-slate-500 text-center py-8">Loading content...</p>
      </div>
    </div>
  </div>

  <script>
    const owner = '28911srujan';
    const repo = 'Crisprus';
    const branch = 'main';

    function init() {
      const token = localStorage.getItem('gh_pat');
      if (token) {
        document.getElementById('tokenSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        fetchFiles();
      }
    }

    function saveToken() {
      const token = document.getElementById('patToken').value.trim();
      if (!token) return showStatus('Please enter a valid PAT token', 'red');
      localStorage.setItem('gh_pat', token);
      document.getElementById('tokenSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      fetchFiles();
    }

    function clearToken() {
      localStorage.removeItem('gh_pat');
      document.getElementById('tokenSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }

    function updateFileLabel() {
      const input = document.getElementById('fileInput');
      if (input.files.length > 0) {
        document.getElementById('fileLabel').innerText = `Selected: ${input.files[0].name}`;
      }
    }

    async function uploadFile() {
      const input = document.getElementById('fileInput');
      const token = localStorage.getItem('gh_pat');
      if (!input.files.length) return showStatus('Please select a file first!', 'red');

      const file = input.files[0];
      const btn = document.getElementById('uploadBtn');
      btn.innerText = "Uploading...";
      btn.disabled = true;

      try {
        const base64Content = await fileToBase64(file);
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${file.name}`;
        
        let sha = null;
        const checkRes = await fetch(url, { headers: { Authorization: `token ${token}` } });
        if (checkRes.ok) {
          const existingData = await checkRes.json();
          sha = existingData.sha;
        }

        const bodyData = {
          message: `Upload ${file.name} via Crisprus Vault`,
          content: base64Content,
          branch: branch
        };
        if (sha) bodyData.sha = sha;

        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });

        if (res.ok) {
          showStatus(`Success! Saved ${file.name} to GitHub repo.`, 'green');
          document.getElementById('fileInput').value = '';
          document.getElementById('fileLabel').innerText = 'Click or drag file here to select';
          fetchFiles();
        } else {
          const err = await res.json();
          showStatus(`Upload failed: ${err.message}`, 'red');
        }
      } catch (e) {
        showStatus(`Error: ${e.message}`, 'red');
      } finally {
        btn.innerText = "Upload Confirm";
        btn.disabled = false;
      }
    }

    async function fetchFiles() {
      const token = localStorage.getItem('gh_pat');
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '<p class="text-center py-4 text-xs text-slate-500">Loading files...</p>';

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}`, {
          headers: { Authorization: `token ${token}` }
        });

        if (!res.ok) throw new Error('Could not fetch repo contents');

        const files = await res.json();
        listEl.innerHTML = '';

        files.filter(f => f.type === 'file').forEach(file => {
          const item = document.createElement('div');
          item.className = 'flex items-center justify-between p-3 text-xs';
          item.innerHTML = `
            <span class="truncate max-w-[160px] font-medium text-slate-200" title="${file.name}">${file.name}</span>
            <div class="flex items-center gap-2">
              <button onclick="previewFile('${file.name}', '${file.download_url}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded text-[11px] font-medium transition">Preview</button>
              <a href="${file.download_url}" download target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded text-[11px] font-medium transition">Download</a>
              <button onclick="deleteFile('${file.name}', '${file.sha}')" class="text-slate-500 hover:text-red-400 p-1">✕</button>
            </div>
          `;
          listEl.appendChild(item);
        });
      } catch (e) {
        listEl.innerHTML = `<p class="text-center py-4 text-xs text-red-400">Error loading files</p>`;
      }
    }

    async function previewFile(filename, downloadUrl) {
      const modal = document.getElementById('previewModal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');
      const dlBtn = document.getElementById('modalDownloadBtn');

      title.innerText = filename;
      dlBtn.href = downloadUrl;
      body.innerHTML = '<p class="text-slate-500 text-center py-8">Loading content...</p>';
      modal.classList.remove('hidden');

      const ext = filename.split('.').pop().toLowerCase();
      const imageExts = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'];

      if (imageExts.includes(ext)) {
        body.innerHTML = `<div class="flex justify-center"><img src="${downloadUrl}" class="max-h-[60vh] object-contain rounded-lg shadow" alt="${filename}"></div>`;
      } else {
        try {
          const res = await fetch(downloadUrl);
          const text = await res.text();

          if (ext === 'md') {
            body.innerHTML = `<div class="prose prose-invert max-w-none text-xs leading-relaxed">${marked.parse(text)}</div>`;
          } else {
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.innerText = text;
            pre.appendChild(code);
            pre.className = 'text-xs p-3 bg-slate-950 rounded border border-slate-800 overflow-x-auto';
            body.innerHTML = '';
            body.appendChild(pre);
            hljs.highlightElement(code);
          }
        } catch (e) {
          body.innerHTML = `<p class="text-red-400 text-center py-8">Failed to preview file contents.</p>`;
        }
      }
    }

    function closePreview() {
      document.getElementById('previewModal').classList.add('hidden');
    }

    async function deleteFile(filename, sha) {
      if (!confirm(`Delete ${filename}?`)) return;
      const token = localStorage.getItem('gh_pat');
      
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
        method: 'DELETE',
        headers: {
          Authorization: `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Delete ${filename}`,
          sha: sha,
          branch: branch
        })
      });

      if (res.ok) {
        showStatus('File deleted successfully', 'green');
        fetchFiles();
      } else {
        showStatus('Failed to delete file', 'red');
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function showStatus(text, type) {
      const el = document.getElementById('statusMsg');
      el.innerText = text;
      el.className = `text-xs text-center p-2 rounded-lg ${type === 'green' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    init();
  </script>
</body>
</html>
