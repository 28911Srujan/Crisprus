<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<main class="container">

    <!-- SELECTED SERVER CONTROL CARD -->
    <section class="server-card glass">

        <div class="server-top">

            <div>
                <div class="label">MINECRAFT SERVER</div>
                <h1 id="selectedServerTitle">SMP</h1>
                <p class="subtext">Ran By: <span id="server-ran-by">None</span></p>
            </div>

            <div id="serverBadge" class="status-badge offline">
                <span class="status-dot"></span>
                <span id="serverStatus">OFFLINE</span>
            </div>

        </div>

        <div id="serverStatusCard" class="status-card offline">

            <div id="serverSymbol" class="status-symbol">
                ●
            </div>

            <div>
                <div class="label">STATUS</div>
                <h2 id="serverTitle">Offline</h2>
                <p id="serverDescription">
                    This server is currently stopped.
                </p>
            </div>

        </div>

        <!-- SERVERS DROPDOWN -->
        <div class="servers-section" style="margin-top: 20px;">
            <div class="label" style="margin-bottom: 8px;">CHOOSE SERVER</div>
            <div id="dropdown" class="dropdown">
                <button id="dropdownButton" class="dropdown-button" type="button">
                    <span id="dropdownText">SMP</span>
                    <span id="dropdownArrow">⌄</span>
                </button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <button class="server-option" data-server="SMP" type="button">SMP</button>
                    <button class="server-option" data-server="SKYWARS" type="button">SKYWARS</button>
                    <button class="server-option" data-server="PVP" type="button">PVP</button>
                    <button class="server-option" data-server="MINIGAME" type="button">MINIGAME</button>
                    <button class="server-option" data-server="PILLARS_OF_FORTUNE" type="button">PILLARS OF FORTUNE</button>
                    <button class="server-option" data-server="ETC" type="button">ETC</button>
                </div>
            </div>
        </div>

        <div class="controls" style="grid-template-columns: 1fr; margin-top: 20px;">
            <button id="start-btn" class="control-btn on" type="button" onclick="requestLaunch()">
                <span>▶</span>
                <span id="startBtnText">START SERVER</span>
            </button>
        </div>

    </section>

</main>

<!-- Firebase Realtime Database SDK Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAVJAuVwWbLlTbeRsa8bxnuTd0ajQMD4u4",
        authDomain: "aio-webcontrol.firebaseapp.com",
        databaseURL: "https://aio-webcontrol-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "aio-webcontrol",
        storageBucket: "aio-webcontrol.firebasestorage.app",
        messagingSenderId: "588457288600",
        appId: "1:588457288600:web:70458e157ee40f1dbfc1ed",
        measurementId: "G-LL3F636K9Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let globalServersData = {};
    let currentSelectedServer = "SMP";

    // Dropdown UI Logic
    const dropdown = document.getElementById('dropdown');
    const dropdownButton = document.getElementById('dropdownButton');
    const dropdownText = document.getElementById('dropdownText');

    dropdownButton.addEventListener('click', () => {
        dropdown.classList.toggle('open');
    });

    window.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
            dropdown.classList.remove('open');
        }
    });

    const serverOptions = document.querySelectorAll('.server-option');
    serverOptions.forEach(option => {
        option.addEventListener('click', () => {
            currentSelectedServer = option.getAttribute('data-server');
            dropdownText.textContent = currentSelectedServer;
            document.getElementById('selectedServerTitle').textContent = currentSelectedServer;
            dropdown.classList.remove('open');
            updateUIState();
        });
    });

    // Listen to Firebase real-time updates
    const serversRef = ref(db, 'servers');
    onValue(serversRef, (snapshot) => {
        globalServersData = snapshot.val() || {};
        updateUIState();
    });

    function updateUIState() {
        const badge = document.getElementById("serverBadge");
        const card = document.getElementById("serverStatusCard");
        const statusText = document.getElementById("serverStatus");
        const title = document.getElementById("serverTitle");
        const desc = document.getElementById("serverDescription");
        const ranBySpan = document.getElementById("server-ran-by");
        const startBtn = document.getElementById("start-btn");
        const startBtnText = document.getElementById("startBtnText");

        const serverData = globalServersData[currentSelectedServer] || {};
        const serverStatus = serverData.ServerStatus || "Offline";
        const serverRanBy = serverData.ServerRanBy || "None";

        ranBySpan.innerText = serverRanBy;

        if (serverStatus === "Running") {
            badge.className = "status-badge online";
            card.className = "status-card online";
            statusText.innerText = "RUNNING";
            title.innerText = "Running";
            desc.innerText = `Server is active and managed by ${serverRanBy}.`;
            startBtn.disabled = true;
            startBtn.style.opacity = "0.6";
            startBtn.style.cursor = "not-allowed";
            startBtnText.innerText = "SERVER IS ACTIVE";
        } else {
            badge.className = "status-badge offline";
            card.className = "status-card offline";
            statusText.innerText = "OFFLINE";
            title.innerText = "Offline";
            desc.innerText = "This server is currently stopped.";
            startBtn.disabled = false;
            startBtn.style.opacity = "1";
            startBtn.style.cursor = "pointer";
            startBtnText.innerText = "START SERVER";
        }
    }

    window.requestLaunch = function() {
        const userName = prompt("Enter your identifier (e.g., PC_A or your name):");
        if (!userName) return;

        const serverPath = `servers/${currentSelectedServer}`;
        
        update(ref(db, serverPath), {
            ServerStatus: "Running",
            ServerRanBy: userName
        }).then(() => {
            alert(`Signal sent for ${currentSelectedServer}! Your local app should detect this and boot up.`);
        });
    }
</script>

</body>
</html>
