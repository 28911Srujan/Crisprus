<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1e1e1e; color: white; margin-top: 50px; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.3); width: 350px; }
        .status { font-weight: bold; padding: 5px 10px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
        .offline { background: #d9534f; }
        .online { background: #5cb85c; }
        button { background: #0275d8; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #025aa5; }
        select { padding: 8px; font-size: 14px; border-radius: 4px; margin-bottom: 10px; width: 80%; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Minecraft Server Status</h2>
        <div id="status-badge" class="status offline">Loading...</div>
        <p>Connector Status: <span id="connector-status">Unknown</span></p>
        
        <label for="server-select">Choose Server:</label><br>
        <select id="server-select">
            <option value="SMP">SMP</option>
            <option value="SKYWARS">SKYWARS</option>
            <option value="PVP">PVP</option>
            <option value="MINIGAME">MINIGAME</option>
            <option value="PILLARS_OF_FORTUNE">PILLARS OF FORTUNE</option>
            <option value="ETC">ETC</option>
        </select>
        <br>
        <button onclick="sendStartCommand()">Request Start (RUN)</button>
    </div>

    <!-- Firebase Realtime Database SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your Firebase configuration (Grab from your Firebase Project Settings)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://aio-webcontrol-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Listen for real-time updates to connector_status and connector_command
        const statusRef = ref(db, '/');
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const badge = document.getElementById("status-badge");
                const statusSpan = document.getElementById("connector-status");
                
                const currentStatus = data.connector_status || "OFFLINE";
                statusSpan.innerText = currentStatus;

                if (currentStatus === "ONLINE") {
                    badge.className = "status online";
                    badge.innerText = "ONLINE / READY";
                } else {
                    badge.className = "status offline";
                    badge.innerText = "STOPPED / OFFLINE";
                }
            }
        });

        // Function triggered when you click the button to start a server
        window.sendStartCommand = function() {
            const selectedServer = document.getElementById("server-select").value;
            
            // Update the database command to RUN for the selected server/connector
            update(ref(db), {
                connector_command: "RUN",
                // You can also log which specific sub-server is targeted if your app needs it
                target_server: selectedServer 
            }).then(() => {
                alert("Command sent! Your local app should catch the 'RUN' signal and boot up.");
            });
        }
    </script>
</body>
</html>
